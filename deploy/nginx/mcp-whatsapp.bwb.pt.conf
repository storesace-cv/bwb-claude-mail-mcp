limit_req_zone $binary_remote_addr zone=mcp_wa_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp-whatsapp.bwb.pt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-whatsapp.bwb.pt;

    # certbot managed — placeholders until certbot runs
    ssl_certificate     /etc/letsencrypt/live/mcp-whatsapp.bwb.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-whatsapp.bwb.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 25M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /health {
        proxy_pass http://127.0.0.1:18001/shim-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /authorize {
        limit_req zone=mcp_wa_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/login {
        limit_req zone=mcp_wa_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Transfer-Encoding "";
    }
}
